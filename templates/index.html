<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Upload de Arquivos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0d2e 0%, #0d1b2a 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
                radial-gradient(1px 1px at 60px 70px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 100px 50px, #ffffff, transparent),
                radial-gradient(1px 1px at 140px 10px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 180px 90px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 220px 30px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 260px 70px, #ffffff, transparent),
                radial-gradient(1px 1px at 300px 20px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 340px 60px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 380px 40px, #ffffff, transparent),
                radial-gradient(1px 1px at 420px 80px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 460px 15px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 500px 55px, #ffffff, transparent),
                radial-gradient(1px 1px at 540px 25px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 580px 75px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 620px 35px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 660px 65px, #ffffff, transparent),
                radial-gradient(1px 1px at 700px 10px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 740px 50px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 780px 30px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 50px 120px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 150px 140px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 250px 110px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 350px 130px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 450px 100px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 550px 150px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 650px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 750px 140px, rgba(255,255,255,0.7), transparent);
            background-size: 800px 200px;
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
            }
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 30px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .upload-section {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px dashed rgba(255,255,255,0.4);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .upload-section.dragover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.7);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }
        
        .upload-section h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.8em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 30px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .file-input-custom:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        
        .file-input-custom.has-file {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.6);
        }
        
        .file-icon-large {
            font-size: 3em;
        }
        
        .file-input-text {
            color: white;
            font-size: 1.1em;
            font-weight: 500;
        }
        
        input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }
        
        select {
            background: rgba(255,255,255,0.9);
            color: #333;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover {
            border-color: rgba(255,255,255,0.5);
            background: white;
        }
        
        select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .loading.active {
            display: block;
        }
        
        .arquivos-section {
            margin-top: 30px;
        }
        
        .arquivos-section h2 {
            color: white;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .refresh-btn {
            background: #28a745;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
        }
        
        .arquivos-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .arquivo-item {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid rgba(255,255,255,0.6);
            transition: all 0.2s;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(5px);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .arquivo-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        
        .arquivo-info {
            flex: 1;
        }
        
        .arquivo-nome {
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
            font-size: 1.1em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .arquivo-detalhes {
            font-size: 0.9em;
            color: rgba(255,255,255,0.9);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .arquivo-acoes {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-download {
            background: rgba(40, 167, 69, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .btn-download:hover {
            background: rgba(40, 167, 69, 1);
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(40, 167, 69, 0.3);
        }
        
        .btn-delete {
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .btn-delete:hover {
            background: rgba(220, 53, 69, 1);
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.3);
        }
        
        .mensagem {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mensagem.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .mensagem.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .vazio {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-style: italic;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .vazio::before {
            content: "📂";
            font-size: 3em;
            display: block;
            margin-bottom: 10px;
        }
        
        .file-icon {
            margin-right: 8px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }
        
        .pastas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            min-height: 300px;
            backdrop-filter: blur(5px);
        }
        
        .pasta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        
        .pasta-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.3);
        }
        
        .pasta-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .pasta-nome {
            font-weight: bold;
            color: white;
            font-size: 1.1em;
            margin-bottom: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .pasta-contador {
            font-size: 0.9em;
            color: rgba(255,255,255,0.9);
        }
        
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-name {
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .btn-logout {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .btn-logout:hover {
            background: #c82333;
        }
        
        .buckets-section {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
        }
        
        .buckets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .buckets-header h3 {
            margin: 0;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .bucket-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .bucket-form input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .bucket-form button {
            padding: 10px 20px;
            font-size: 14px;
        }
        
        .buckets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .bucket-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid rgba(255,255,255,0.6);
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        
        .bucket-item.selected {
            border-left-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.3);
        }
        
        .bucket-item:hover {
            box-shadow: 0 2px 8px rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.25);
        }
        
        .bucket-info {
            flex: 1;
        }
        
        .bucket-name {
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .bucket-details {
            font-size: 0.85em;
            color: rgba(255,255,255,0.9);
        }
        
        .bucket-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-select {
            background: rgba(40, 167, 69, 0.8);
            color: white;
            padding: 8px 15px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .btn-select:hover {
            background: rgba(40, 167, 69, 1);
            box-shadow: 0 3px 10px rgba(40, 167, 69, 0.3);
        }
        
        .btn-select.selected {
            background: rgba(108, 117, 125, 0.8);
            cursor: default;
        }
        
        .btn-select.selected:hover {
            background: rgba(108, 117, 125, 0.8);
        }
        
        .bucket-badge {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: 10px;
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
        }
        
        .bucket-badge.selected {
            background: rgba(40, 167, 69, 0.8);
            border-color: rgba(40, 167, 69, 0.6);
        }
        
        .bucket-badge.private {
            background: rgba(108, 117, 125, 0.8);
            border-color: rgba(108, 117, 125, 0.6);
        }
        
        .share-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .share-modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .share-modal-header h3 {
            margin: 0;
            color: #333;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .close-modal:hover {
            color: #333;
        }
        
        .share-url-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .share-url-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
        }
        
        .btn-copy {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-copy:hover {
            background: #5568d3;
        }
        
        .share-expiration {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .btn-change-policy {
            background: #ffc107;
            color: #333;
            padding: 8px 15px;
            font-size: 13px;
        }
        
        .btn-change-policy:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Meus Arquivos Acadêmicos</h1>
        <p class="subtitle">Organize seus trabalhos, provas e materiais de estudo</p>
        
        <div class="user-header" id="userHeader" style="display: none;">
            <div class="user-info">
                <span>👤</span>
                <span class="user-name" id="userName">Carregando...</span>
            </div>
            <button class="btn btn-logout" onclick="fazerLogout()">🚪 Sair</button>
        </div>
        
        <div id="mensagem"></div>
        
        <div class="buckets-section" id="bucketsSection" style="display: none;">
            <div class="buckets-header">
                <h3>🗂️ Gerenciar Buckets</h3>
                <button class="btn refresh-btn" onclick="carregarBuckets()">🔄 Atualizar</button>
            </div>
            
            <div class="bucket-form">
                <input type="text" id="bucketNameInput" placeholder="Nome do bucket (ex: meus-arquivos)" maxlength="63">
                <button class="btn" onclick="criarBucket()" id="criarBucketBtn">➕ Criar Bucket</button>
            </div>
            
            <div id="bucketsList" class="buckets-list">
                <!-- Buckets serão inseridos aqui -->
            </div>
        </div>
        
        <div class="upload-section" id="uploadSection">
            <h2>📤 Enviar Novo Arquivo</h2>
            <form class="upload-form" id="uploadForm" enctype="multipart/form-data">
                <div class="file-input-wrapper">
                    <div class="file-input-custom" id="fileInputCustom">
                        <span class="file-icon-large">📁</span>
                        <span class="file-input-text" id="fileInputText">Clique ou arraste um arquivo aqui</span>
                    </div>
                    <input type="file" id="arquivoInput" name="arquivo" required>
                </div>
                <select id="categoriaInput" name="categoria" required>
                    <option value="Trabalhos">📝 Trabalhos</option>
                    <option value="Provas">📋 Provas</option>
                    <option value="Materiais">📚 Materiais</option>
                    <option value="Aulas">🎓 Aulas</option>
                </select>
                <button type="submit" id="uploadBtn" style="padding: 18px; font-size: 1.1em; margin-top: 10px;">
                    ⬆️ Enviar Arquivo
                </button>
            </form>
        </div>
        
        <div class="loading" id="loading">
            Carregando...
        </div>
        
        <div class="arquivos-section" id="arquivosSection">
            <div id="breadcrumb" style="display: none; margin-bottom: 20px; padding: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; backdrop-filter: blur(5px);">
                <button class="btn" onclick="voltarParaPastas()" style="background: rgba(108, 117, 125, 0.8); color: white; padding: 8px 15px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3);">
                    ← Voltar
                </button>
                <span id="categoriaAtual" style="margin-left: 15px; font-weight: bold; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3);"></span>
            </div>
            
            <h2 id="sectionTitle">Área de Trabalho</h2>
            
            <div class="stats" id="stats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalArquivos">0</div>
                    <div class="stat-label">Total de Arquivos</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="tamanhoTotal">0 KB</div>
                    <div class="stat-label">Tamanho Total</div>
                </div>
            </div>
            
            <div id="pastasContainer" class="pastas-grid">
                <!-- Pastas serão inseridas aqui -->
            </div>
            
            <div id="arquivosList" class="arquivos-list" style="display: none;">
                <!-- Arquivos serão inseridos aqui -->
            </div>
        </div>
    </div>
    
    <!-- Modal de Compartilhamento -->
    <div id="shareModal" class="share-modal">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <h3>🔗 Compartilhar Arquivo</h3>
                <button class="close-modal" onclick="fecharModalCompartilhamento()">&times;</button>
            </div>
            <div id="shareModalContent">
                <!-- Conteúdo será inserido aqui -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let usuarioLogado = null;
        
        let categoriaAtual = null;
        let todosArquivos = [];
        
        // Verificar autenticação e carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', async () => {
            await verificarAutenticacao();
            if (usuarioLogado) {
                carregarBuckets();
                carregarTodasPastas();
            }
            
            // Configurar upload
            const form = document.getElementById('uploadForm');
            form.addEventListener('submit', handleUpload);
            
            // Atualizar texto do input de arquivo
            const fileInput = document.getElementById('arquivoInput');
            const fileInputCustom = document.getElementById('fileInputCustom');
            const fileInputText = document.getElementById('fileInputText');
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const fileName = e.target.files[0].name;
                    fileInputText.textContent = `📄 ${fileName}`;
                    fileInputCustom.classList.add('has-file');
                } else {
                    fileInputText.textContent = 'Clique ou arraste um arquivo aqui';
                    fileInputCustom.classList.remove('has-file');
                }
            });
            
            // Clique no custom input
            fileInputCustom.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Drag and drop
            const uploadSection = document.getElementById('uploadSection');
            
            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });
            
            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('dragover');
            });
            
            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    const fileName = e.dataTransfer.files[0].name;
                    fileInputText.textContent = `📄 ${fileName}`;
                    fileInputCustom.classList.add('has-file');
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });
        
        async function verificarAutenticacao() {
            try {
                const response = await fetch(`${API_BASE}/usuario`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                
                const data = await response.json();
                if (data.sucesso) {
                    usuarioLogado = data.usuario;
                    document.getElementById('userName').textContent = usuarioLogado.username;
                    document.getElementById('userHeader').style.display = 'flex';
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Erro ao verificar autenticação:', error);
                window.location.href = '/login';
            }
        }
        
        async function fazerLogout() {
            try {
                const response = await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                const data = await response.json();
                if (data.sucesso) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Erro ao fazer logout:', error);
                window.location.href = '/login';
            }
        }
        
        function formatarTamanho(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function formatarData(dataString) {
            const data = new Date(dataString);
            return data.toLocaleString('pt-BR');
        }
        
        function mostrarMensagem(texto, tipo = 'success') {
            const mensagemDiv = document.getElementById('mensagem');
            mensagemDiv.className = `mensagem ${tipo}`;
            mensagemDiv.textContent = texto;
            mensagemDiv.style.display = 'block';
            
            setTimeout(() => {
                mensagemDiv.style.display = 'none';
            }, 5000);
        }
        
        async function carregarTodasPastas() {
            const loading = document.getElementById('loading');
            loading.classList.add('active');
            
            try {
                const response = await fetch(`${API_BASE}/arquivos`, {
                    credentials: 'include'
                });
                
                if (response.status === 401 || response.status == 403) {
                    window.location.href = '/login';
                    return;
                }
                
                const data = await response.json();
                
                if (data.sucesso) {
                    todosArquivos = data.arquivos || [];
                    
                    // Verificar se há mensagem sobre bucket não selecionado
                    if (data.mensagem && data.mensagem.includes('Nenhum bucket selecionado')) {
                        const arquivosList = document.getElementById('arquivosList');
                        arquivosList.innerHTML = `
                            <div class="vazio" style="text-align: center; padding: 40px;">
                                <div style="font-size: 3em; margin-bottom: 20px;">🗂️</div>
                                <h3 style="margin-bottom: 10px;">Nenhum bucket selecionado</h3>
                                <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px;">
                                    Selecione um bucket acima para começar a gerenciar seus arquivos.
                                </p>
                            </div>
                        `;
                        atualizarEstatisticas([]);
                    } else {
                        exibirPastas();
                        atualizarEstatisticas(data.arquivos);
                    }
                } else {
                    mostrarMensagem('Erro ao carregar arquivos: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao conectar com o servidor', 'error');
            } finally {
                loading.classList.remove('active');
            }
        }
        
        function exibirPastas() {
            const pastasContainer = document.getElementById('pastasContainer');
            const arquivosList = document.getElementById('arquivosList');
            const breadcrumb = document.getElementById('breadcrumb');
            const sectionTitle = document.getElementById('sectionTitle');
            
            // Esconder lista de arquivos e mostrar pastas
            arquivosList.style.display = 'none';
            pastasContainer.style.display = 'grid';
            breadcrumb.style.display = 'none';
            sectionTitle.textContent = 'Área de Trabalho';
            categoriaAtual = null;
            
            // Contar arquivos por categoria
            const contadores = {
                'Trabalhos': 0,
                'Provas': 0,
                'Materiais': 0,
                'Aulas': 0
            };
            
            todosArquivos.forEach(arq => {
                const cat = arq.categoria || 'Aulas';
                if (contadores.hasOwnProperty(cat)) {
                    contadores[cat]++;
                }
            });
            
            const pastas = [
                { nome: 'Trabalhos', icon: '📝', categoria: 'Trabalhos', cor: '#667eea' },
                { nome: 'Provas', icon: '📋', categoria: 'Provas', cor: '#dc3545' },
                { nome: 'Materiais', icon: '📚', categoria: 'Materiais', cor: '#28a745' },
                { nome: 'Aulas', icon: '🎓', categoria: 'Aulas', cor: '#ffc107' }
            ];
            
            pastasContainer.innerHTML = pastas.map(pasta => `
                <div class="pasta-item" onclick="entrarNaPasta('${pasta.categoria}')" 
                     style="border-color: ${pasta.cor};">
                    <div class="pasta-icon">${pasta.icon}</div>
                    <div class="pasta-nome">${pasta.nome}</div>
                    <div class="pasta-contador">${contadores[pasta.categoria]} arquivo${contadores[pasta.categoria] !== 1 ? 's' : ''}</div>
                </div>
            `).join('');
        }
        
        function entrarNaPasta(categoria) {
            categoriaAtual = categoria;
            const arquivosFiltrados = todosArquivos.filter(arq => (arq.categoria || 'Aulas') === categoria);
            
            const pastasContainer = document.getElementById('pastasContainer');
            const arquivosList = document.getElementById('arquivosList');
            const breadcrumb = document.getElementById('breadcrumb');
            const categoriaAtualSpan = document.getElementById('categoriaAtual');
            const sectionTitle = document.getElementById('sectionTitle');
            
            // Esconder pastas e mostrar arquivos
            pastasContainer.style.display = 'none';
            arquivosList.style.display = 'flex';
            breadcrumb.style.display = 'flex';
            
            const nomesCategoria = {
                'Trabalhos': '📝 Trabalhos',
                'Provas': '📋 Provas',
                'Materiais': '📚 Materiais',
                'Aulas': '🎓 Aulas'
            };
            
            categoriaAtualSpan.textContent = nomesCategoria[categoria] || categoria;
            sectionTitle.textContent = nomesCategoria[categoria] || categoria;
            
            exibirArquivos(arquivosFiltrados);
            atualizarEstatisticas(arquivosFiltrados);
        }
        
        function voltarParaPastas() {
            exibirPastas();
        }
        
        async function carregarArquivos() {
            await carregarTodasPastas();
        }
        
        function exibirArquivos(arquivos) {
            const arquivosList = document.getElementById('arquivosList');
            
            if (arquivos.length === 0) {
                arquivosList.innerHTML = '<div class="vazio">Nenhum arquivo ainda. Faça upload de um arquivo para começar!</div>';
                return;
            }
            
            const categoriaIcon = {
                'Trabalhos': '📝',
                'Provas': '📋',
                'Materiais': '📚',
                'Aulas': '🎓',
                'Outros': '📁'
            };
            
            arquivosList.innerHTML = arquivos.map(arquivo => {
                const categoria = arquivo.categoria || 'Aulas';
                const icon = categoriaIcon[categoria] || '📄';
                // Não mostrar badge de categoria se estiver dentro de uma pasta
                const badgeCategoria = categoriaAtual ? '' : `<span style="background: #667eea; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 10px;">${categoria}</span>`;
                return `
                <div class="arquivo-item">
                    <div class="arquivo-info">
                        <div class="arquivo-nome">
                            <span class="file-icon">${icon}</span>
                            ${arquivo.nome_original}
                            ${badgeCategoria}
                        </div>
                        <div class="arquivo-detalhes">
                            <span>📏 ${formatarTamanho(arquivo.tamanho)}</span>
                            <span>📅 ${formatarData(arquivo.data_upload)}</span>
                            <span>🏷️ ${arquivo.tipo || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="arquivo-acoes">
                        <button class="btn btn-download" onclick="baixarArquivo('${arquivo.id}', '${arquivo.nome_original.replace(/'/g, "\\'")}')">⬇️ Download</button>
                        <button class="btn" onclick="compartilharArquivo('${arquivo.id}', '${arquivo.nome_original.replace(/'/g, "\\'")}')" style="background: #17a2b8; color: white; padding: 10px 20px; font-size: 14px;">🔗 Compartilhar</button>
                        <button class="btn btn-delete" onclick="deletarArquivo('${arquivo.id}', '${arquivo.nome_original.replace(/'/g, "\\'")}')">🗑️ Deletar</button>
                    </div>
                </div>
            `;
            }).join('');
        }
        
        function atualizarEstatisticas(arquivos) {
            const stats = document.getElementById('stats');
            const totalArquivos = document.getElementById('totalArquivos');
            const tamanhoTotal = document.getElementById('tamanhoTotal');
            
            if (arquivos.length > 0) {
                stats.style.display = 'flex';
                totalArquivos.textContent = arquivos.length;
                
                const totalBytes = arquivos.reduce((sum, arq) => sum + arq.tamanho, 0);
                tamanhoTotal.textContent = formatarTamanho(totalBytes);
            } else {
                stats.style.display = 'none';
            }
        }
        
        async function handleUpload(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('arquivoInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInputText = document.getElementById('fileInputText');
            const fileInputCustom = document.getElementById('fileInputCustom');
            
            // Verificar se há bucket selecionado antes de fazer upload
            try {
                const bucketsResponse = await fetch(`${API_BASE}/buckets`, {
                    credentials: 'include'
                });
                if (bucketsResponse.ok) {
                    const bucketsData = await bucketsResponse.json();
                    if (bucketsData.sucesso && !bucketsData.selected_bucket) {
                        mostrarMensagem('Por favor, selecione um bucket antes de enviar arquivos', 'error');
                        return;
                    }
                }
            } catch (error) {
                console.error('Erro ao verificar bucket:', error);
            }
            
            if (!fileInput.files.length) {
                mostrarMensagem('Por favor, selecione um arquivo', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('arquivo', fileInput.files[0]);
            formData.append('categoria', document.getElementById('categoriaInput').value);
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Enviando...';
            
            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    fileInput.value = '';
                    if (fileInputText) fileInputText.textContent = 'Clique ou arraste um arquivo aqui';
                    if (fileInputCustom) fileInputCustom.classList.remove('has-file');
                    await carregarTodasPastas();
                    // Se estiver dentro de uma pasta, atualizar a visualização
                    if (categoriaAtual) {
                        entrarNaPasta(categoriaAtual);
                    }
                } else {
                    mostrarMensagem('Erro: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao enviar arquivo: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = '⬆️ Enviar Arquivo';
            }
        }
        
        async function baixarArquivo(id, nome) {
            try {
                mostrarMensagem('Iniciando download...', 'success');
                
                const response = await fetch(`${API_BASE}/arquivos/${id}/download`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    // Tentar ler como JSON se possível
                    let errorMsg = 'Erro desconhecido';
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.erro || errorMsg;
                    } catch (e) {
                        errorMsg = `Erro HTTP ${response.status}: ${response.statusText}`;
                    }
                    mostrarMensagem('Erro ao baixar arquivo: ' + errorMsg, 'error');
                    return;
                }
                
                // Obter o blob do arquivo
                const blob = await response.blob();
                
                // Verificar se o blob está vazio
                if (blob.size === 0) {
                    mostrarMensagem('Erro: Arquivo baixado está vazio', 'error');
                    return;
                }
                
                // Sanitizar nome do arquivo completamente para Windows
                let filename = nome;
                
                // Remover todos os caracteres inválidos
                filename = filename.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_');
                
                // Remover espaços no início e fim
                filename = filename.trim();
                
                // Remover pontos no início e fim (Windows não permite)
                filename = filename.replace(/^\.+|\.+$/g, '');
                
                // Se ficou vazio, criar nome padrão
                if (!filename || filename.length === 0) {
                    const extensao = nome.includes('.') ? '.' + nome.split('.').pop() : '';
                    filename = `arquivo_${id}${extensao}`;
                }
                
                // Limitar tamanho do nome (Windows tem limite de 255 caracteres)
                if (filename.length > 200) {
                    const extensao = filename.includes('.') ? '.' + filename.split('.').pop() : '';
                    filename = filename.substring(0, 200 - extensao.length) + extensao;
                }
                
                // Criar URL temporária para o blob
                const url = window.URL.createObjectURL(blob);
                
                // Criar link temporário com todas as propriedades necessárias
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename; // Nome do arquivo para download
                a.setAttribute('download', filename); // Garantir atributo download
                a.setAttribute('target', '_blank'); // Abrir em nova aba (força download)
                
                // Adicionar ao DOM (necessário para funcionar)
                document.body.appendChild(a);
                
                // Criar evento de clique e disparar
                const clickEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                a.dispatchEvent(clickEvent);
                
                // Também tentar click() direto como fallback
                setTimeout(() => {
                    a.click();
                }, 10);
                
                // Aguardar um pouco antes de limpar (garantir que download iniciou)
                setTimeout(() => {
                    // Limpar
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                }, 100);
                
                mostrarMensagem(`Download iniciado: ${filename}`, 'success');
            } catch (error) {
                console.error('Erro ao baixar arquivo:', error);
                mostrarMensagem('Erro ao baixar arquivo: ' + error.message, 'error');
            }
        }
        
        async function deletarArquivo(id, nome) {
            if (!confirm(`Tem certeza que deseja deletar o arquivo "${nome}"?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/arquivos/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    await carregarTodasPastas();
                    // Se estiver dentro de uma pasta, atualizar a visualização
                    if (categoriaAtual) {
                        entrarNaPasta(categoriaAtual);
                    }
                } else {
                    mostrarMensagem('Erro: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao deletar arquivo: ' + error.message, 'error');
            }
        }
        
        // Funções de gerenciamento de buckets
        async function carregarBuckets() {
            try {
                const response = await fetch(`${API_BASE}/buckets`, {
                    credentials: 'include'
                });
                
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                
                const data = await response.json();
                
                if (data.sucesso) {
                    exibirBuckets(data.buckets, data.selected_bucket);
                    document.getElementById('bucketsSection').style.display = 'block';
                } else {
                    mostrarMensagem('Erro ao carregar buckets: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao conectar com o servidor', 'error');
            }
        }
        
        function exibirBuckets(buckets, selectedBucket) {
            const bucketsList = document.getElementById('bucketsList');
            
            if (buckets.length === 0) {
                bucketsList.innerHTML = '<div class="vazio">Nenhum bucket criado. Crie um bucket para começar!</div>';
                return;
            }
            
            bucketsList.innerHTML = buckets.map(bucket => {
                const isSelected = bucket.name === selectedBucket;
                const sizeFormatted = formatarTamanho(bucket.size || 0);
                return `
                    <div class="bucket-item ${isSelected ? 'selected' : ''}">
                        <div class="bucket-info">
                            <div class="bucket-name">
                                🗂️ ${bucket.name}
                                ${isSelected ? '<span class="bucket-badge selected">Selecionado</span>' : ''}
                                <span class="bucket-badge private">🔒 Privado e Seguro</span>
                            </div>
                        </div>
                        <div class="bucket-actions">
                            ${!isSelected ? `<button class="btn btn-select" onclick="selecionarBucket('${bucket.name}')">✓ Selecionar</button>` : ''}
                            <button class="btn btn-delete" onclick="deletarBucket('${bucket.name}')">🗑️ Deletar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function criarBucket() {
            const bucketNameInput = document.getElementById('bucketNameInput');
            const criarBucketBtn = document.getElementById('criarBucketBtn');
            const bucketName = bucketNameInput.value.trim().toLowerCase();
            const policyType = 'private'; // Sempre privado
            
            if (!bucketName) {
                mostrarMensagem('Por favor, digite um nome para o bucket', 'error');
                return;
            }
            
            // Validar nome do bucket
            if (bucketName.length < 3 || bucketName.length > 63) {
                mostrarMensagem('Nome do bucket deve ter entre 3 e 63 caracteres', 'error');
                return;
            }
            
            if (!/^[a-z0-9.-]+$/.test(bucketName)) {
                mostrarMensagem('Nome do bucket pode conter apenas letras minúsculas, números, pontos e hífens', 'error');
                return;
            }
            
            criarBucketBtn.disabled = true;
            criarBucketBtn.textContent = '⏳ Criando...';
            
            try {
                const response = await fetch(`${API_BASE}/buckets`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ 
                        nome: bucketName,
                        policy_type: policyType
                    })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    bucketNameInput.value = '';
                    await carregarBuckets();
                } else {
                    mostrarMensagem('Erro: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao criar bucket: ' + error.message, 'error');
            } finally {
                criarBucketBtn.disabled = false;
                criarBucketBtn.textContent = '➕ Criar Bucket';
            }
        }
        
        async function selecionarBucket(bucketName) {
            try {
                const response = await fetch(`${API_BASE}/buckets/select`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ nome: bucketName })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    await carregarBuckets();
                    await carregarTodasPastas();
                } else {
                    mostrarMensagem('Erro: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao selecionar bucket: ' + error.message, 'error');
            }
        }
        
        async function deletarBucket(bucketName) {
            if (!confirm(`⚠️ ATENÇÃO: Tem certeza que deseja deletar o bucket "${bucketName}"?\n\n🗑️ Todos os arquivos dentro deste bucket serão PERMANENTEMENTE DELETADOS!\n\nEsta ação não pode ser desfeita.`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/buckets/${bucketName}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    await carregarBuckets();
                    await carregarTodasPastas();
                } else {
                    mostrarMensagem('Erro: ' + data.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao deletar bucket: ' + error.message, 'error');
            }
        }
        
        async function compartilharArquivo(fileId, nomeArquivo) {
            try {
                // Solicitar tempo de expiração (padrão 1 hora)
                const horas = prompt('Por quantas horas o link deve ser válido? (padrão: 1 hora, máximo: 168 horas = 7 dias)', '1');
                if (horas === null) return; // Usuário cancelou
                
                const horasNum = Math.min(Math.max(parseInt(horas) || 1, 1), 168); // Entre 1 e 168 horas
                const expiration = horasNum * 3600; // Converter para segundos
                
                // Mostrar modal de carregamento
                const modal = document.getElementById('shareModal');
                const modalContent = document.getElementById('shareModalContent');
                modal.style.display = 'block';
                modalContent.innerHTML = '<p>⏳ Gerando link de compartilhamento...</p>';
                
                const response = await fetch(`${API_BASE}/arquivos/${fileId}/share`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ expiration: expiration })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    const expiresAt = new Date(data.expires_at);
                    const expiresAtFormatted = expiresAt.toLocaleString('pt-BR');
                    
                    modalContent.innerHTML = `
                        <div class="share-modal-header">
                            <h3>🔗 Link de Compartilhamento</h3>
                        </div>
                        <p style="margin-bottom: 15px;"><strong>Arquivo:</strong> ${nomeArquivo}</p>
                        <div class="share-url-container">
                            <input type="text" id="shareUrlInput" class="share-url-input" value="${data.url}" readonly>
                            <button class="btn btn-copy" onclick="copiarLinkCompartilhamento()">📋 Copiar</button>
                        </div>
                        <div class="share-expiration">
                            ⏰ Link expira em: ${expiresAtFormatted}
                        </div>
                        <p style="font-size: 0.9em; color: #666; margin-top: 15px;">
                            💡 Compartilhe este link com quem você deseja dar acesso ao arquivo. O link expira automaticamente após o tempo especificado.
                        </p>
                    `;
                } else {
                    modalContent.innerHTML = `
                        <div class="share-modal-header">
                            <h3>❌ Erro</h3>
                        </div>
                        <p style="color: #dc3545;">${data.erro}</p>
                        <button class="btn" onclick="fecharModalCompartilhamento()" style="margin-top: 15px;">Fechar</button>
                    `;
                }
            } catch (error) {
                const modalContent = document.getElementById('shareModalContent');
                modalContent.innerHTML = `
                    <div class="share-modal-header">
                        <h3>❌ Erro</h3>
                    </div>
                    <p style="color: #dc3545;">Erro ao gerar link: ${error.message}</p>
                    <button class="btn" onclick="fecharModalCompartilhamento()" style="margin-top: 15px;">Fechar</button>
                `;
            }
        }
        
        function copiarLinkCompartilhamento() {
            const urlInput = document.getElementById('shareUrlInput');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999); // Para mobile
            
            try {
                document.execCommand('copy');
                mostrarMensagem('Link copiado para a área de transferência!', 'success');
            } catch (err) {
                // Fallback: selecionar texto manualmente
                urlInput.focus();
                urlInput.select();
                mostrarMensagem('Selecione e copie o link manualmente (Ctrl+C)', 'error');
            }
        }
        
        function fecharModalCompartilhamento() {
            document.getElementById('shareModal').style.display = 'none';
        }
        
        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('shareModal');
            if (event.target === modal) {
                fecharModalCompartilhamento();
            }
        }
        
        // Permitir criar bucket com Enter
        document.addEventListener('DOMContentLoaded', () => {
            const bucketNameInput = document.getElementById('bucketNameInput');
            if (bucketNameInput) {
                bucketNameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        criarBucket();
                    }
                });
            }
        });
    </script>
</body>
</html>
