<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0d2e 0%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
                radial-gradient(1px 1px at 60px 70px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 100px 50px, #ffffff, transparent),
                radial-gradient(1px 1px at 140px 10px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 180px 90px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 220px 30px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 260px 70px, #ffffff, transparent),
                radial-gradient(1px 1px at 300px 20px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 340px 60px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 380px 40px, #ffffff, transparent),
                radial-gradient(1px 1px at 420px 80px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 460px 15px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 500px 55px, #ffffff, transparent),
                radial-gradient(1px 1px at 540px 25px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 580px 75px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 620px 35px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 660px 65px, #ffffff, transparent),
                radial-gradient(1px 1px at 700px 10px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 740px 50px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 780px 30px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 50px 120px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 150px 140px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 250px 110px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 350px 130px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 450px 100px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 550px 150px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 650px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 750px 140px, rgba(255,255,255,0.7), transparent);
            background-size: 800px 200px;
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
            }
        }
        
        .login-container {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        
        input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.6);
            background: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .mensagem {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mensagem.success {
            background: rgba(212, 237, 218, 0.9);
            color: #155724;
            border: 1px solid rgba(195, 230, 203, 0.8);
        }
        
        .mensagem.error {
            background: rgba(248, 215, 218, 0.9);
            color: #721c24;
            border: 1px solid rgba(245, 198, 203, 0.8);
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.9);
        }
        
        .toggle-form a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .toggle-form a:hover {
            text-decoration: underline;
        }
        
        .default-credentials {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: white;
            backdrop-filter: blur(5px);
        }
        
        .default-credentials strong {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Login</h1>
        <p class="subtitle">Sistema de Upload de Arquivos</p>
        
        <div class="default-credentials">
            <strong>Usuário padrão:</strong><br>
            Usuário: <strong>admin</strong><br>
            Senha: <strong>admin123</strong>
        </div>
        
        <div id="mensagem"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
        </form>
        
        <div class="toggle-form">
            Não tem uma conta? <a href="#" onclick="mostrarRegistro(); return false;">Cadastre-se</a>
        </div>
        
        <form id="registroForm" style="display: none;">
            <div class="form-group">
                <label for="reg_username">Usuário</label>
                <input type="text" id="reg_username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="reg_email">Email</label>
                <input type="email" id="reg_email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="reg_password">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="reg_password" name="password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" id="registroBtn">Cadastrar</button>
            <button type="button" class="btn btn-secondary" onclick="mostrarLogin()">Voltar</button>
        </form>
    </div>

    <script>
        const API_BASE = '/api';
        
        function mostrarMensagem(texto, tipo = 'success') {
            const mensagemDiv = document.getElementById('mensagem');
            mensagemDiv.className = `mensagem ${tipo}`;
            mensagemDiv.textContent = texto;
            mensagemDiv.style.display = 'block';
            
            setTimeout(() => {
                mensagemDiv.style.display = 'none';
            }, 5000);
        }
        
        function mostrarRegistro() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registroForm').style.display = 'block';
        }
        
        function mostrarLogin() {
            document.getElementById('registroForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem('Login realizado com sucesso! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    mostrarMensagem(data.erro || 'Erro ao fazer login', 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao conectar com o servidor', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });
        
        // Registro
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('reg_username').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const registroBtn = document.getElementById('registroBtn');
            
            registroBtn.disabled = true;
            registroBtn.textContent = 'Cadastrando...';
            
            try {
                const response = await fetch(`${API_BASE}/registro`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    mostrarMensagem(data.mensagem, 'success');
                    setTimeout(() => {
                        mostrarLogin();
                        document.getElementById('username').value = username;
                    }, 2000);
                } else {
                    mostrarMensagem(data.erro || 'Erro ao cadastrar', 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao conectar com o servidor', 'error');
            } finally {
                registroBtn.disabled = false;
                registroBtn.textContent = 'Cadastrar';
            }
        });
    </script>
</body>
</html>
