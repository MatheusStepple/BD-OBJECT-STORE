services:
  # Serviço MinIO
  minio:
    image: minio/minio:latest
    container_name: bd-object-store-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # Serviço Flask (Backend)
  backend:
    build: .
    container_name: bd-object-store-backend
    ports:
      - "${PORT:-5000}:5000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-dados-privados}
      SECRET_KEY: ${SECRET_KEY:-770f5dc8-ec89-46b7-adf9-5ed1ec19b682}
      FLASK_ENV: ${FLASK_ENV:-development}
      PORT: 5000
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  app-network:
    driver: bridge

